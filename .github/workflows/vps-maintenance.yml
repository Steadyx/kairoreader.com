name: VPS maintenance

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  maintain:
    name: Update VPS and refresh deployment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate maintenance secrets
        shell: bash
        run: |
          missing=0
          for name in VPS_HOST VPS_PORT VPS_USER VPS_SSH_KEY VPS_APP_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set"
              missing=1
            fi
          done

          case "$VPS_APP_DIR" in
            ""|"/"|"/root"|"/home"|"/opt"|"/usr"|"/var")
              echo "::error::VPS_APP_DIR must be a dedicated app directory, for example /opt/kairoreader.com"
              missing=1
              ;;
          esac

          exit "$missing"

      - name: Prepare SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/kairoreader_deploy
          chmod 600 ~/.ssh/kairoreader_deploy
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload maintenance script
        shell: bash
        run: |
          remote="${VPS_USER}@${VPS_HOST}"
          scp_opts=(-i ~/.ssh/kairoreader_deploy -P "$VPS_PORT")
          scp "${scp_opts[@]}" .cicd/update-vps.sh "$remote:/tmp/kairoreader-update-vps.sh"

      - name: Update packages and refresh deployment
        shell: bash
        run: |
          remote="${VPS_USER}@${VPS_HOST}"
          ssh_opts=(-i ~/.ssh/kairoreader_deploy -p "$VPS_PORT")

          ssh "${ssh_opts[@]}" "$remote" \
            "set -eu
             chmod 700 /tmp/kairoreader-update-vps.sh
             if [ \"\$(id -u)\" -eq 0 ]; then
               /tmp/kairoreader-update-vps.sh
             elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
               sudo /tmp/kairoreader-update-vps.sh
             else
               echo 'VPS package maintenance requires root or passwordless sudo.' >&2
               exit 1
             fi
             rm -f /tmp/kairoreader-update-vps.sh
             cd '$VPS_APP_DIR'
             if [ ! -x .cicd/deploy.sh ]; then
               echo 'No deployed maintenance-capable release found. Deploy main once first.' >&2
               exit 1
             fi
             APP_DIR='$VPS_APP_DIR' ./.cicd/deploy.sh"
