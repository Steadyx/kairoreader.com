    <title>Kairo: Focused RSVP and Bionic Reader for Android</title>
    <meta
      name="description"
      content="Read EPUB, PDF, DOCX and more with Kairo for Android. Move between a calm reader, adaptive RSVP and Bionic Reading while your data stays local."
    />
    <meta
      name="keywords"
      content="Kairo reader, Android RSVP reader, Bionic Reading app, speed reading app, EPUB reader, PDF reader, DOCX reader, local ebook reader"
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="theme-color" content="#071011" />
    <script>
      (() => {
        let theme = "dark";

        try {
          const storedTheme = localStorage.getItem("kairo-theme");
          const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
          theme = storedTheme === "light" || storedTheme === "dark" ? storedTheme : prefersDark ? "dark" : "light";
        } catch {
          theme = "dark";
        }

        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle("dark", theme === "dark");
        const themeColor = document.querySelector('meta[name="theme-color"]');

        if (themeColor) {
          themeColor.content = theme === "dark" ? "#071011" : "#f4f6f3";
        }
      })();
    </script>
